<!DOCTYPE html>
<html lang="es">
<head>

  <title>Gestión de Camas</title>
  <style>

   @media (max-width: 600px) {
  .camilla {
    font-size: 12px;
    padding: 10px 0;
  }

  .boton-sala {
    font-size: 12px;
    width: 80px;
    height: 80px;
  }

    background-size: 250px;
  }
}
   body {
  background-color: #e0f0ff;
  background-image: url('logo-mcr.png');
  background-repeat: no-repeat;
  background-position: center center;
  background-size: 300px;
  background-attachment: fixed;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .menu-salas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .boton-sala {
      background-color: #1e88e5;
      color: white;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
    }

    .boton-sala.inactiva {
      background-color: #b0bec5;
    }

    .boton-sala:hover {
      background-color: #1565c0;
    }

    .camillas {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 40px;
    }

    .camilla {
      background-color: #d32f2f;
      color: white;
      border-radius: 5px;
      padding: 15px 0;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .camilla.disponible {
      background-color: #4caf50;
    }

    @media (max-width: 600px) {
      .camilla {
        font-size: 12px;
        padding: 10px 0;
      }

      .boton-sala {
        font-size: 12px;
        width: 80px;
        height: 80px;
      }

      body {
        background-size: 250px;
      }
    }
  </style>
</head>

    const menu = document.getElementById("menuSalas");
    const contenedor = document.getElementById("contenedorCamillas");

    let salaVisible = null;

    function cargarEstadoSala(nombreSala) {
      const data = localStorage.getItem(nombreSala);
      return data ? JSON.parse(data) : Array(100).fill(false);
    }

    function guardarEstadoSala(nombreSala, estado) {
      localStorage.setItem(nombreSala, JSON.stringify(estado));
    }

    salas.forEach(sala => {
      const boton = document.createElement("button");
      boton.className = "boton-sala";
      boton.textContent = sala.nombre;
      menu.appendChild(boton);

      const estado = cargarEstadoSala(sala.nombre);

      const grid = document.createElement("div");
      grid.className = "camillas";
      grid.id = sala.nombre.replace(/\s+/g, "_");

      const camillas = [];
      for (let i = sala.rango[0]; i <= sala.rango[1]; i++) {
        const etiqueta = sala.etiquetas[i] || "";
        camillas.push({ num: i, etiqueta });
      }

      camillas.forEach(camilla => {
        const div = document.createElement("div");
        div.className = "camilla";
        div.textContent = camilla.etiqueta ? `${camilla.num}\n${camilla.etiqueta}` : `${camilla.num}`;

        div.addEventListener("click", () => {
          estado[camilla.num - sala.rango[0]] = !estado[camilla.num - sala.rango[0]];
          div.classList.toggle("disponible");
          guardarEstadoSala(sala.nombre, estado);
        });

        if (estado[camilla.num - sala.rango[0]]) {
          div.classList.add("disponible");
        }

        grid.appendChild(div);
      });

      contenedor.appendChild(grid);

      boton.addEventListener("click", () => {
  if (salaVisible === grid) {
    // Ocultar la sala y resetear todos los botones a azul
    grid.style.display = "none";
    salaVisible = null;
    document.querySelectorAll(".boton-sala").forEach(b => b.classList.remove("inactiva"));
  } else {
    // Ocultar todas las salas y mostrar esta
    document.querySelectorAll(".camillas").forEach(div => div.style.display = "none");
    document.querySelectorAll(".boton-sala").forEach(b => b.classList.add("inactiva"));
    boton.classList.remove("inactiva");
    grid.style.display = "grid";
    salaVisible = grid;
  }
});
